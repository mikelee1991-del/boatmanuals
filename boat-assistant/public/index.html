<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Offline Flyer 8 boat Q&A — answers from your vessel dataset, no API key"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,650;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Flyer 8 Boat Guide</title>
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">HIN BEYFT208F223 · offline</p>
          <h1>Flyer 8 Boat Guide</h1>
          <p class="tagline">Ask about <em>your</em> boat. Answers pull from the <strong>boat binder</strong> in this repo — offline, no API key.</p>
        </div>
      </header>

      <section class="status ok" id="status">Loading boat knowledge…</section>

      <form class="ask" id="form">
        <label class="sr-only" for="q">Question</label>
        <textarea
          id="q"
          rows="3"
          required
          placeholder='Example: Where is my fuel/water separator and how do I know whether it needs to be replaced?'
        ></textarea>
        <button type="submit" id="askBtn">Get answer</button>
      </form>

      <section class="chips" id="chips" aria-label="Example questions"></section>

      <article class="answer" id="answer" hidden>
        <header>
          <h2>Answer</h2>
          <span class="badge" id="confidence"></span>
        </header>
        <div class="body" id="answerBody"></div>
        <div class="sources" id="sources"></div>
      </article>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
