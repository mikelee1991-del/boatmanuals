# Build the offline Q&A from boat-dictionary/ and publish it on GitHub Pages.
# One-time: Repo Settings → Pages → Source = GitHub Actions.
name: Deploy Boat Guide

on:
  push:
    branches: [main]
    paths:
      - "boat-dictionary/**"
      - "boat-assistant/**"
      - ".github/workflows/deploy-boat-guide.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build knowledge bundle from boat binder
        run: |
          cd boat-assistant
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: boat-assistant/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
