<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1f2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Flyer 8 SPACEdeck mobile assistant — Grok plus onboard manuals dataset"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <title>Flyer 8 Assistant</title>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">HIN BEYFT208F223</p>
            <h1>Flyer 8 Assistant</h1>
          </div>
        </div>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7m8.3 2.7l-1.1-.2a6.9 6.9 0 0 0-.6-1.4l.7-.9a1 1 0 0 0-.1-1.3l-1.4-1.4a1 1 0 0 0-1.3-.1l-.9.7c-.45-.25-.92-.46-1.4-.6l-.2-1.1A1 1 0 0 0 13 4h-2a1 1 0 0 0-1 .8l-.2 1.1c-.48.14-.95.35-1.4.6l-.9-.7a1 1 0 0 0-1.3.1L4.8 7.3a1 1 0 0 0-.1 1.3l.7.9c-.25.45-.46.92-.6 1.4l-1.1.2A1 1 0 0 0 3 12v2a1 1 0 0 0 .8 1l1.1.2c.14.48.35.95.6 1.4l-.7.9a1 1 0 0 0 .1 1.3l1.4 1.4a1 1 0 0 0 1.3.1l.9-.7c.45.25.92.46 1.4.6l.2 1.1a1 1 0 0 0 1 .8h2a1 1 0 0 0 1-.8l.2-1.1c.48-.14.95-.35 1.4-.6l.9.7a1 1 0 0 0 1.3-.1l1.4-1.4a1 1 0 0 0 .1-1.3l-.7-.9c.25-.45.46-.92.6-1.4l1.1-.2a1 1 0 0 0 .8-1v-2a1 1 0 0 0-.8-1Z"
            />
          </svg>
        </button>
      </header>

      <section class="status" id="statusBar" aria-live="polite">
        Loading vessel dataset…
      </section>

      <section class="chips" id="chips" aria-label="Quick questions"></section>

      <main class="chat" id="chat" aria-live="polite"></main>

      <form class="composer" id="composer">
        <label class="sr-only" for="input">Ask about the boat</label>
        <textarea
          id="input"
          rows="1"
          enterkeyhint="send"
          placeholder="e.g. No start — what should I check?"
          required
        ></textarea>
        <button type="submit" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M3.4 20.6 21 12 3.4 3.4l.1 7.2L15 12l-11.5 1.4z" />
          </svg>
        </button>
      </form>
    </div>

    <dialog class="sheet" id="settings">
      <form method="dialog" class="sheet-card" id="settingsForm">
        <header>
          <h2>Settings</h2>
          <button type="submit" class="icon-btn" aria-label="Close">✕</button>
        </header>
        <p class="hint">
          Uses <strong>Grok (xAI)</strong> with the full Flyer 8 owner dataset loaded into context.
          Key stays in this browser (session) unless you set <code>XAI_API_KEY</code> on the server.
        </p>
        <label>
          xAI API key
          <input
            id="apiKey"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="xai-…"
          />
        </label>
        <label>
          Model
          <select id="model">
            <option value="grok-4.5">grok-4.5</option>
            <option value="grok-4">grok-4</option>
            <option value="grok-3">grok-3</option>
            <option value="grok-3-mini">grok-3-mini</option>
          </select>
        </label>
        <div class="row">
          <button type="button" class="btn secondary" id="clearChat">Clear chat</button>
          <button type="submit" class="btn primary">Done</button>
        </div>
        <p class="meta" id="settingsMeta"></p>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
