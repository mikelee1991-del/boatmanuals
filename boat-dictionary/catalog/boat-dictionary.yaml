symptom_index:
  no_start: [engine-verado-300-v8, dts-controls, electrical_baseline]
  overheat: [engine-verado-300-v8]
  hard_steering: [steering-power]
  no_shift: [dts-controls, engine-verado-300-v8]
  listing_or_porpoising: [zipwake, lenco-tabs, engine-verado-300-v8]
  no_depth: [garmin-echomap]
  windlass_dead: [windlass, electrical_baseline]
  thruster_dead: [bow-thruster, electrical_baseline]
  fridge_warm: [cabin-fridge, electrical_baseline]
  toilet_fail: [electric-toilet]
  shore_power_issues: [shore-power-charger]
  stereo_dead: [fusion-audio]
  blank_engine_data: [vesselview-or-gauges, garmin-echomap, dts-controls]

